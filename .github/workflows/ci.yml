name: iOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Select available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          test -n "$SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Build minimum deployment target
        run: xcodebuild build -project Medio.xcodeproj -scheme Medio -destination 'generic/platform=iOS Simulator' IPHONEOS_DEPLOYMENT_TARGET=15.5 SWIFT_VERSION=6 CODE_SIGNING_ALLOWED=NO
      - name: Build current SDK
        run: xcodebuild build-for-testing -project Medio.xcodeproj -scheme Medio -testPlan Medio -destination "platform=iOS Simulator,id=$SIMULATOR_ID" SWIFT_VERSION=6 CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: xcodebuild test-without-building -project Medio.xcodeproj -scheme Medio -testPlan Medio -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:MedioTests CODE_SIGNING_ALLOWED=NO
      - name: Run UI tests
        run: xcodebuild test-without-building -project Medio.xcodeproj -scheme Medio -testPlan Medio -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:MedioUITests CODE_SIGNING_ALLOWED=NO
